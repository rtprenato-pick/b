<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras Inteligente</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <div class="max-w-2xl mx-auto p-4 sm:p-6">
        
        <!-- Cabeçalho -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-brand-600 dark:text-brand-500 flex items-center gap-2">
                    <i class="fa-solid font-bold fa-basket-shopping"></i> Lista de Compras
                </h1>
                <p class="text-xs text-gray-500 dark:text-gray-400" id="sync-status">Status: Carregando dados...</p>
            </div>
            <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:block text-yellow-400"></i>
            </button>
        </header>

        <!-- Configuração de Chaves -->
        <div id="config-warning" class="hidden mb-6 p-4 bg-amber-100 dark:bg-amber-900/40 border border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-200 rounded-xl text-sm">
            <p class="font-bold flex items-center gap-2 mb-1">
                <i class="fa-solid fa-triangle-exclamation"></i> Configuração do JSONBin Pendente
            </p>
            <p>Por favor, edite o arquivo <code>script.js</code> no seu repositório e substitua as variáveis <strong>BIN_ID</strong> e <strong>API_KEY</strong> com suas chaves do jsonbin.io.</p>
        </div>

        <!-- Formulário de Adicionar Item -->
        <form id="item-form" class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-md mb-6 transition">
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                <input type="text" id="item-name" placeholder="Nome do item (ex: Leite)" required class="sm:col-span-6 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
                
                <input type="number" id="item-qty" placeholder="Qtd" value="1" min="0.1" step="any" required class="sm:col-span-3 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
                
                <input type="number" id="item-price" placeholder="R$ Unid." min="0" step="0.01" class="sm:col-span-3 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div class="flex gap-2 mt-3">
                <select id="item-category" class="flex-1 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="Geral">📦 Geral</option>
                    <option value="Hortifruti">🍎 Hortifruti</option>
                    <option value="Laticínios">🧀 Laticínios / Frios</option>
                    <option value="Padaria">🍞 Padaria</option>
                    <option value="Açougue">🥩 Açougue</option>
                    <option value="Bebidas">🧃 Bebidas</option>
                    <option value="Limpeza">🧹 Limpeza</option>
                    <option value="Higiene">🧴 Higiene</option>
                </select>
                
                <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-5 py-2 rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add
                </button>
            </div>
        </form>

        <!-- Filtros e Busca -->
        <div class="flex flex-col sm:flex-row gap-3 mb-4 justify-between items-center">
            <input type="text" id="search-input" placeholder="🔍 Buscar na lista..." class="w-full sm:w-1/2 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 text-sm">
            <div class="flex gap-2 w-full sm:w-auto">
                <button data-filter="all" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-brand-600 text-white">Todos</button>
                <button data-filter="pending" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-200 dark:bg-gray-700">Pendentes</button>
                <button data-filter="completed" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-200 dark:bg-gray-700">Comprados</button>
            </div>
        </div>

        <!-- Lista de Itens -->
        <div id="shopping-list" class="space-y-2 mb-6"></div>

        <!-- Total do Carrinho -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-md flex justify-between items-center font-bold text-lg">
            <span>Total Estimado:</span>
            <span id="total-price" class="text-brand-600 dark:text-brand-500">R$ 0,00</span>
        </div>

    </div>

    <!-- Vinculação do Script Externo -->
    <script src="script.js"></script>
</body>
</html>
