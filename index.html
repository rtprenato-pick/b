<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras Inteligente</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- BIBLIOTECA EXCEL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <div class="max-w-2xl mx-auto p-4 sm:p-6">
        
        <!-- Cabeçalho -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-brand-600 dark:text-brand-500 flex items-center gap-2">
                    <i class="fa-solid font-bold fa-basket-shopping"></i> Lista de Compras
                </h1>
                <p class="text-xs text-gray-500 dark:text-gray-400" id="sync-status">Status: Carregando dados...</p>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <!-- BOTÃO LIMPAR LISTA SIMPLIFICADO -->
                <button onclick="clearAllItems()" title="Limpar Lista Inteira" class="p-2 rounded-lg bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300 hover:bg-red-200 transition text-sm flex items-center gap-1 font-semibold">
                    <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">Limpar</span>
                </button>

                <button onclick="exportToExcel()" title="Exportar para Excel" class="p-2 rounded-lg bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-200 transition text-sm flex items-center gap-1 font-semibold">
                    <i class="fa-solid fa-file-excel"></i> <span class="hidden sm:inline">Exportar</span>
                </button>
                
                <label title="Importar do Excel" class="p-2 rounded-lg bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 hover:bg-blue-200 transition text-sm flex items-center gap-1 font-semibold cursor-pointer">
                    <i class="fa-solid fa-file-import"></i> <span class="hidden sm:inline">Importar</span>
                    <input type="file" id="excel-input" accept=".xlsx, .xls" class="hidden" onchange="importFromExcel(event)">
                </label>

                <button id="theme-toggle" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 transition">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-yellow-400"></i>
                </button>
            </div>
        </header>

        <!-- Formulário de Adicionar Item -->
        <form id="item-form" class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-md mb-6 transition">
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                <input type="text" id="item-name" placeholder="Nome do item" required class="sm:col-span-6 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <input type="number" id="item-qty" placeholder="Qtd" value="1" min="0.1" step="any" required class="sm:col-span-3 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <input type="number" id="item-price" placeholder="R$ Unid." min="0" step="0.01" class="sm:col-span-3 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>

            <div class="flex gap-2 mt-3">
                <select id="item-category" class="flex-1 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="Geral">📦 Geral</option>
                    <option value="Hortifruti">🍎 Hortifruti</option>
                    <option value="Laticínios">🧀 Laticínios / Frios</option>
                    <option value="Padaria">🍞 Padaria</option>
                    <option value="Açougue">🥩 Açougue</option>
                    <option value="Bebidas">🧃 Bebidas</option>
                    <option value="Limpeza">🧹 Limpeza</option>
                    <option value="Higiene">🧴 Higiene</option>
                    <option value="Carnes e Aves">🍗 Carnes e Aves</option>
                </select>
                <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-5 py-2 rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add
                </button>
            </div>
        </form>

        <!-- Filtros e Busca -->
        <div class="flex flex-col sm:flex-row gap-3 mb-4 justify-between items-center">
            <input type="text" id="search-input" placeholder="🔍 Buscar na lista..." class="w-full sm:w-1/2 px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 text-sm">
            <div class="flex gap-2 w-full sm:w-auto">
                <button data-filter="all" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-brand-600 text-white transition">Todos</button>
                <button data-filter="pending" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 transition">Pendentes</button>
                <button data-filter="completed" class="filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 transition">Comprados</button>
            </div>
        </div>

        <!-- Lista de Itens -->
        <div id="shopping-list" class="space-y-3 mb-6"></div>

        <!-- Total do Carrinho -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-md flex justify-between items-center font-bold text-lg">
            <span>Total Estimado:</span>
            <span id="total-price" class="text-brand-600 dark:text-brand-500">R$ 0,00</span>
        </div>

    </div>

    <!-- SCRIPT PRINCIPAL EMBUTIDO -->
    <script>
        // --- CONFIGURAÇÃO DO JSONBIN ---
        const BIN_ID = '6abd57bfac6210605a066d22'; 
        const API_KEY = '$2a$10$Ou3dLTtyVpyo5yy8ZYcedOJd42.3SyIritGLDH/cs60eFVjjjjDNS'; 

        let items = [];
        let currentFilter = 'all';

        let form, listContainer, totalPriceEl, syncStatusEl;

        document.addEventListener('DOMContentLoaded', () => {
            form = document.getElementById('item-form');
            listContainer = document.getElementById('shopping-list');
            totalPriceEl = document.getElementById('total-price');
            syncStatusEl = document.getElementById('sync-status');

            loadItems();
            initTheme();

            if (form) {
                form.addEventListener('submit', handleAddItem);
            }

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.className = 'filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 transition');
                    e.target.className = 'filter-btn text-xs font-semibold px-3 py-1.5 rounded-lg bg-brand-600 text-white transition';
                    currentFilter = e.target.dataset.filter;
                    render();
                });
            });

            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', render);
            }
        });

        // Carregar Itens da Nuvem
        async function loadItems() {
            if (!BIN_ID || BIN_ID === 'COLE_AQUI_O_SEU_BIN_ID') {
                if (syncStatusEl) syncStatusEl.textContent = 'Status: Configuração pendente';
                return;
            }

            if (syncStatusEl) syncStatusEl.textContent = 'Status: Sincronizando...';
            
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    method: 'GET',
                    headers: { 
                        'X-Master-Key': API_KEY,
                        'Cache-Control': 'no-cache'
                    }
                });

                if (!res.ok) throw new Error(`Erro na API: ${res.status}`);

                const data = await res.json();
                
                if (Array.isArray(data.record)) {
                    items = data.record;
                } else if (typeof data.record === 'object' && data.record !== null) {
                    items = Object.values(data.record);
                } else {
                    items = [];
                }

                if (syncStatusEl) syncStatusEl.textContent = 'Status: Sincronizado com a nuvem ✓';
                render();
            } catch (err) {
                console.error('Erro ao carregar:', err);
                if (syncStatusEl) syncStatusEl.textContent = 'Status: Erro ao carregar da nuvem';
                items = JSON.parse(localStorage.getItem('minha_lista') || '[]');
                render();
            }
        }

        // Salvar Itens na Nuvem (Envia a lista atual, mesmo que vazia)
        async function saveItems() {
            localStorage.setItem('minha_lista', JSON.stringify(items));
            if (!BIN_ID || BIN_ID === 'COLE_AQUI_O_SEU_BIN_ID') return;

            if (syncStatusEl) syncStatusEl.textContent = 'Status: Salvando...';
            
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY,
                        'X-Bin-Versioning': 'false'
                    },
                    body: JSON.stringify(items)
                });

                if (res.ok) {
                    if (syncStatusEl) syncStatusEl.textContent = 'Status: Sincronizado com a nuvem ✓';
                } else {
                    throw new Error(`Erro ao salvar: ${res.status}`);
                }
            } catch (err) {
                console.error('Erro ao salvar:', err);
                if (syncStatusEl) syncStatusEl.textContent = 'Status: Erro ao salvar na nuvem';
            }
        }

        function handleAddItem(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                name: document.getElementById('item-name').value.trim(),
                qty: parseFloat(document.getElementById('item-qty').value) || 1,
                price: parseFloat(document.getElementById('item-price').value) || 0,
                category: document.getElementById('item-category').value,
                completed: false,
                image: ''
            };

            items.push(newItem);
            form.reset();
            document.getElementById('item-qty').value = '1';
            render();
            saveItems();
        }

        function toggleItem(id) {
            items = items.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
            render();
            saveItems();
        }

        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            render();
            saveItems();
        }

        // --- FUNÇÃO SIMPLIFICADA PARA LIMPAR A LISTA E O SERVIDOR ---
        async function clearAllItems() {
            if (items.length === 0) {
                alert("A lista já está vazia!");
                return;
            }

            // Confirmação simples
            if (confirm("⚠️ ATENÇÃO: Deseja apagar TODOS os itens da lista?\n\nIsso limpará a tela e também enviará uma lista vazia para o servidor, começando do zero.")) {
                // 1. Esvazia a lista local
                items = [];
                render();
                
                // 2. Envia a lista vazia para o servidor (substitui os dados antigos)
                await saveItems();
                
                alert("✅ Lista apagada com sucesso! O servidor também foi limpo.");
            }
        }

        // --- RENDERIZAÇÃO COM SUPORTE A IMAGENS ---
        function render() {
            const searchInput = document.getElementById('search-input');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
            if (!listContainer) return;
            
            listContainer.innerHTML = '';

            const filteredItems = items.filter(item => {
                if (!item || !item.name) return false;
                const matchesSearch = item.name.toLowerCase().includes(searchTerm);
                const matchesFilter = currentFilter === 'all' ? true : 
                                      currentFilter === 'completed' ? item.completed : !item.completed;
                return matchesSearch && matchesFilter;
            });

            if (filteredItems.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-8 text-gray-400">Nenhum item encontrado</div>`;
                calculateTotal();
                return;
            }

            filteredItems.forEach(item => {
                const el = document.createElement('div');
                el.className = `flex items-center justify-between p-3 bg-white dark:bg-gray-800 rounded-xl shadow-sm transition border-l-4 ${item.completed ? 'border-gray-400 opacity-60' : 'border-brand-500'}`;
                
                const itemTotal = ((item.qty || 1) * (item.price || 0)).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                const imgHtml = item.image 
                    ? `<img src="${item.image}" referrerpolicy="no-referrer" class="w-14 h-14 object-contain rounded-lg bg-white p-1 border dark:border-gray-600" onerror="this.onerror=null; this.src='https://placehold.co/56x56/eee/999?text=Foto';">`
                    : `<div class="w-14 h-14 bg-gray-100 dark:bg-gray-700 rounded-lg flex items-center justify-center text-gray-400 text-xs border dark:border-gray-600"><i class="fa-solid fa-image"></i></div>`;

                el.innerHTML = `
                    <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleItem(${item.id})">
                        <div class="flex-shrink-0">
                            ${imgHtml}
                        </div>
                        <input type="checkbox" ${item.completed ? 'checked' : ''} class="w-5 h-5 text-brand-600 rounded">
                        <div>
                            <span class="font-semibold ${item.completed ? 'line-through text-gray-400' : ''}">${item.name}</span>
                            <div class="text-xs text-gray-500 dark:text-gray-400">
                                <span>${item.qty}x</span> • <span>${item.category}</span>
                                ${item.price > 0 ? `• <span>R$ ${item.price.toFixed(2)} un.</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-sm ${item.completed ? 'text-gray-400' : 'text-brand-600 dark:text-brand-400'}">${itemTotal}</span>
                        <button onclick="event.stopPropagation(); deleteItem(${item.id})" class="text-gray-400 hover:text-red-500 p-1">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(el);
            });

            calculateTotal();
        }

        function calculateTotal() {
            if (!totalPriceEl) return;
            const total = items.reduce((acc, item) => acc + ((item.qty || 1) * (item.price || 0)), 0);
            totalPriceEl.textContent = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function initTheme() {
            const toggle = document.getElementById('theme-toggle');
            if (!toggle) return;
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            toggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });
        }

        // --- FUNCIONALIDADES EXCEL ---

        function exportToExcel() {
            if (typeof XLSX === 'undefined') {
                alert("A biblioteca do Excel ainda está a carregar ou foi bloqueada. Recarregue a página (Ctrl + F5).");
                return;
            }

            if (!items || items.length === 0) {
                alert("A sua lista está vazia! Adicione pelo menos um item antes de exportar.");
                return;
            }

            try {
                const excelData = items.map(item => ({
                    "Item": item.name || '',
                    "Quantidade": item.qty || 1,
                    "Preço Unitário (R$)": item.price || 0,
                    "Categoria": item.category || "Geral",
                    "Comprado": item.completed ? "Sim" : "Não",
                    "imagem": item.image || ''
                }));

                const worksheet = XLSX.utils.json_to_sheet(excelData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Lista de Compras");

                XLSX.writeFile(workbook, "lista_de_compras.xlsx");
            } catch (err) {
                console.error("Erro ao gerar Excel:", err);
                alert("Ocorreu um erro ao gerar o ficheiro Excel.");
            }
        }

        function importFromExcel(event) {
            if (typeof XLSX === 'undefined') {
                alert("A biblioteca do Excel ainda está a carregar. Recarregue a página (Ctrl + F5).");
                return;
            }

            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const importedJson = XLSX.utils.sheet_to_json(worksheet);

                    if (importedJson.length === 0) {
                        alert("O ficheiro Excel selecionado está vazio.");
                        return;
                    }

                    const newItems = importedJson.map((row, index) => {
                        const cleanRow = {};
                        Object.keys(row).forEach(k => cleanRow[k.trim()] = row[k]);

                        return {
                            id: Date.now() + index,
                            name: String(cleanRow["Item"] || cleanRow["Nome"] || cleanRow["item"] || "Item sem nome").trim(),
                            qty: parseFloat(cleanRow["Quantidade"] || cleanRow["Qtd"] || cleanRow["qty"]) || 1,
                            price: parseFloat(cleanRow["Preço Unitário (R$)"] || cleanRow["Preço Unit."] || cleanRow["Preço"] || cleanRow["price"]) || 0,
                            category: String(cleanRow["Categoria"] || cleanRow["category"] || "Geral").trim(),
                            completed: String(cleanRow["Comprado"] || cleanRow["completed"]).toLowerCase() === "sim" || cleanRow["Comprado"] === true,
                            image: String(cleanRow["imagem"] || cleanRow["Imagem"] || cleanRow["image"] || "").trim()
                        };
                    });

                    items = [...items, ...newItems];

                    render();
                    saveItems();

                    alert(`${newItems.length} itens importados com sucesso!`);
                    event.target.value = '';
                } catch (err) {
                    console.error("Erro ao importar Excel:", err);
                    alert("Erro ao ler o ficheiro Excel. Verifique a estrutura do ficheiro.");
                }
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
